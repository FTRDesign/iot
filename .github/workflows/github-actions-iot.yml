name: Build STM32 Firmware

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build STM32 project with generated Makefiles
    runs-on: ubuntu-22.04

    steps:
      # 1. Baixa o conteúdo do repositório para o runner Ubuntu
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instala as ferramentas necessárias para executar os Makefiles
      - name: Install ARM GCC toolchain and Make
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      # 3. Mostra as versões utilizadas no CI
      - name: Show build tool versions
        run: |
          make --version
          arm-none-eabi-gcc --version
          arm-none-eabi-objcopy --version

      # 4. Removed cyclomatic complexity targets
      - name: Remove unsupported cyclomatic complexity targets
        run: |
          find Debug -name subdir.mk -type f -exec \
            sed -i -E 's#[[:space:]]+[^[:space:]]*%\.cyclo:#:#' {} +

          if grep -R --line-number \
            --include='subdir.mk' \
            '%\.cyclo:' Debug; then
            echo "::error::A .cyclo target is still present in the generated Makefiles"
            exit 1
          fi

      # 5. Executa o makefile gerado pelo STM32CubeIDE
      - name: Build firmware
        run: make -C Debug -j"$(nproc)" all

      # 6. Gera os outros formatos a partir do ELF
      - name: Generate additional firmware files
        run: |
          arm-none-eabi-objcopy -O ihex Debug/iot.elf Debug/iot.hex
          arm-none-eabi-objcopy -O binary Debug/iot.elf Debug/iot.bin
          arm-none-eabi-objdump -h -S Debug/iot.elf > Debug/iot.list
          arm-none-eabi-size Debug/iot.elf

      # 7. Confirma que todos os arquivos foram criados
      - name: List output files
        run: |
          echo "Arquivos gerados:"
          ls -lh \
            Debug/iot.elf \
            Debug/iot.hex \
            Debug/iot.bin \
            Debug/iot.map \
            Debug/iot.list

      # 8. Disponibiliza os arquivos na página do GitHub Actions
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-artifacts
          path: |
            Debug/iot.elf
            Debug/iot.hex
            Debug/iot.bin
            Debug/iot.map
            Debug/iot.list
          if-no-files-found: error