name: Build STM32 Firmware (STM32CubeIDE)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build STM32CubeIDE Project
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install STM32CubeIDE CLI dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip default-jre gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build project using STM32CubeIDE
        uses: xanderhendriks/action-build-stm32cubeide@v15.0
        with:
          project-path: '.'
          project-target: 'iot'

      - name: Generate HEX file from ELF
        run: |
          arm-none-eabi-objcopy -O ihex Debug/iot.elf Debug/iot.hex

      - name: List output files
        run: |
          echo "Arquivos gerados:"
          find Debug/ -name '*.elf' -o -name '*.hex' -o -name '*.map' -o -name '*.list'

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-artifacts
          path: |
            Debug/*.elf
            Debug/*.hex
            Debug/*.map
            Debug/*.list
